<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="老陈的知识库 — 记录学习，记录生活。一个关于技术、阅读与思考的个人博客。">
  <title>老陈的知识库</title>

  <!-- 公共样式库 -->
  <link rel="stylesheet" href="/css/ink-style.css?v=20260725">

  <!-- marked.js CDN (唯一外部依赖) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* 页面加载时的模糊渐显效果 */
    .hero__title { filter: blur(0); }
    .js-loading .hero__title { filter: blur(4px); }
  </style>

  <script>
    /* 防止页面闪烁：在 JS 加载前先应用保存的主题 */
    (function() {
      try {
        var state = JSON.parse(localStorage.getItem('blog-theme'));
        if (state) {
          var accent = state.accent;
          if (!accent && state.preset === 'dianqing') accent = '#3b5e7a';
          else if (!accent && state.preset === 'zhuqing') accent = '#5a825a';
          else if (!accent) accent = '#be4f4f';
          document.documentElement.style.setProperty('--color-accent', accent);
          var dark = state.dark !== null ? state.dark : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        }
      } catch(_) {}
    })();
  </script>
</head>
<body class="js-loading">

  <!-- 主页视图 -->
  <div id="home-view">
    <main class="container">
      <!-- Hero -->
      <header class="hero">
        <h1 class="hero__title">老陈的知识库</h1>
        <p class="hero__subtitle">记录学习，记录生活</p>
        <div class="hero__divider" aria-hidden="true"></div>
      </header>

      <!-- 文章列表（JS 动态渲染） -->
      <nav id="posts-list" aria-label="文章列表"></nav>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__nav">
        <a href="#/about">关于</a>
        <a href="https://github.com/chenbb3" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
      <p style="margin-top:var(--space-sm)">&copy; 2026 老陈</p>
    </footer>
  </div>

  <!-- 文章视图（初始隐藏） -->
  <article id="article-view" style="display:none"></article>

  <!-- 脚本：按依赖顺序加载 -->
  <script src="/js/markdown.js?v=20260725"></script>
  <script src="/js/theme.js?v=20260725"></script>
  <script src="/js/router.js?v=20260725"></script>
  <script>
    /* 入口：初始化所有子系统 */
    initTheme();
    initRouter();
    /* 移除加载状态，触发模糊→清晰的过渡 */
    document.body.classList.remove('js-loading');
  </script>

</body>
</html>
